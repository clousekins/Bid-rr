# Parent company -> the brands that hire under it.
#
# A persona must not be shown jobs at a company their own resume says they
# work for, and that has to survive the subsidiary: Brian's resume says
# UnitedHealth Group, so an Optum posting is the same employer reading his
# application. Listing a brand here hides it for anyone claiming the parent,
# and hides the parent for anyone claiming the brand.
#
# Add your own as you meet them; unknown companies simply match on their own
# name, which is the common case.

groups:
