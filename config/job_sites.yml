# Discovery boards — public APIs / ATS career pages first
# LinkedIn intentionally excluded. Count ≈ feed adapters + ATS board tokens (20–30+).

settings:
  us_remote_strict: true
  max_pages_per_source: 5
  request_timeout_sec: 30
  concurrency: 4
  skip_already_applied_company: true
  batch_insert_limit: 50

sites:
  - id: jobright
    name: Jobright
    enabled: true
    adapter: jobright
    base_url: https://jobright.ai
    notes: Their own search API when JOBRIGHT_COOKIE is set (it pages, and filters by date server-side); otherwise the public remote-jobs pages their robots.txt allows

  - id: remoteok
    name: Remote OK
    enabled: true
    adapter: remoteok
    base_url: https://remoteok.com
    notes: Public JSON API

  - id: remotive
    name: Remotive
    enabled: true
    adapter: remotive
    base_url: https://remotive.com
    notes: Public JSON API

  - id: weworkremotely
    name: We Work Remotely
    enabled: true
    adapter: weworkremotely
    base_url: https://weworkremotely.com
    notes: RSS feeds

  - id: himalayas
    name: Himalayas
    enabled: true
    adapter: himalayas
    base_url: https://himalayas.app
    notes: Public jobs API

  - id: jobicy
    name: Jobicy
    enabled: true
    adapter: jobicy
    base_url: https://jobicy.com
    notes: Public JSON API

  - id: arbeitnow
    name: Arbeitnow
    enabled: true
    adapter: arbeitnow
    base_url: https://www.arbeitnow.com
    notes: Public JSON API (filter US remote)

  - id: themuse
    name: The Muse
    enabled: true
    adapter: themuse
    base_url: https://www.themuse.com
    notes: Public jobs API

  - id: greenhouse_ats
    name: Greenhouse ATS
    enabled: true
    adapter: greenhouse
    base_url: https://boards-api.greenhouse.io
    notes: Company board tokens from greenhouse_boards

  - id: lever_ats
    name: Lever ATS
    enabled: true
    adapter: lever
    base_url: https://api.lever.co
    notes: Company posting slugs from lever_boards

  - id: ashby_ats
    name: Ashby ATS
    enabled: true
    adapter: ashby
    base_url: https://api.ashbyhq.com
    notes: Job-board names from ashby_boards

  - id: workable_ats
    name: Workable ATS
    enabled: true
    adapter: workable
    base_url: https://apply.workable.com
    notes: Public widget/jobs JSON; tokens from Discover companies

  - id: hn_whoishiring
    name: HN Who is Hiring
    enabled: true
    adapter: hn_whoishiring
    base_url: https://news.ycombinator.com
    notes: Monthly Ask HN thread via Algolia (real company names)

  - id: indeed
    name: Indeed
    enabled: false
    adapter: indeed
    base_url: https://www.indeed.com
    notes: Bot-walled; deferred

  - id: glassdoor
    name: Glassdoor
    enabled: false
    adapter: glassdoor
    base_url: https://www.glassdoor.com
    notes: Deferred

  - id: dice
    name: Dice
    enabled: false
    adapter: dice
    base_url: https://www.dice.com
    notes: No public API; deferred

  - id: wellfound
    name: Wellfound
    enabled: false
    adapter: wellfound
    base_url: https://wellfound.com
    notes: No public API; deferred

