# Company discovery — finds real employer ATS career pages.
# Providers (in order): Google CSE / SerpAPI / OpenAI web search, then ATS slug probe fallback.
# Slug probing needs no API key (industry best practice for Greenhouse/Lever/Ashby).

max_boards_per_run: 500
max_queries_per_run: 24
openai_queries_per_run: 6
openai_fail_fast: 2
results_per_page: 10
max_pages_per_query: 5
probe_concurrency: 12
probe_limit: 400

# Curated ATS slug candidates. Probing skips tokens already in the catalog.
# Keep this list to real employer board tokens (not product/library names).
